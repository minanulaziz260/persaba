<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSABA CUP 7 — Bagan Turnamen Sepakbola Brebes</title>
<!-- html2canvas for Download Feature -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --y:#FFD400;          
    --k:#111111;          
    --w:#FFFFFF;          
    --k60:rgba(17,17,17,.6);
    --k30:rgba(17,17,17,.3);
    --bg-pat:rgba(17,17,17,.045);
    --display:'Impact','Haettenschweiler','Franklin Gothic Bold','Arial Narrow',sans-serif;
    --body:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  }
  body.dark-mode {
    --k:#f0f0f0;          
    --w:#181818;          
    --k60:rgba(240,240,240,.6);
    --k30:rgba(240,240,240,.3);
    --bg-pat:rgba(255,255,255,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    color:var(--k);
    background:var(--w);
    min-height:100vh;
    position:relative;
    transition: background 0.3s, color 0.3s;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:repeating-linear-gradient(-45deg, rgba(255,212,0,.10) 0 90px, rgba(255,212,0,0) 90px 180px);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:repeating-linear-gradient(135deg, var(--bg-pat) 0 2px, transparent 2px 26px);
  }
  .hidden{display:none!important}
  img.dead{display:none!important}

  /* ================= MASTHEAD ================= */
  .hazard{height:9px;background:repeating-linear-gradient(-45deg,var(--k) 0 16px,var(--y) 16px 32px)}
  .hazard.anim{animation:crawl 2.6s linear infinite}
  @keyframes crawl{to{background-position:45.25px 0}}

  .masthead{background:var(--k);color:var(--w);position:relative;overflow:hidden}
  .masthead::before{ 
    content:'';position:absolute;inset:-60% -20%;pointer-events:none;
    background:repeating-linear-gradient(45deg, rgba(255,212,0,.07) 0 46px, rgba(255,212,0,0) 46px 92px);
    animation:drift 22s linear infinite;
  }
  @keyframes drift{to{transform:translateX(130px)}}
  .mast-inner{
    max-width:1200px;margin:0 auto;padding:30px 22px 26px;position:relative;
    display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;
  }
  .crest{width:120px;height:120px;display:block;flex:none;filter:drop-shadow(4px 4px 0 rgba(255,212,0,.35))}
  .crest img,.crest svg{width:100%;height:100%;display:block;object-fit:contain}
  .crest{transition:transform .25s ease}
  .crest:hover{transform:rotate(-6deg) scale(1.05)}

  .eyebrow{
    font-family:var(--display);font-size:.8rem;letter-spacing:.42em;color:var(--y);
    display:flex;align-items:center;gap:12px;text-transform:uppercase;
  }
  .eyebrow::before{content:'';width:34px;height:4px;background:var(--y)}
  h1{
    font-family:var(--display);font-weight:400;text-transform:uppercase;
    font-size:clamp(2.7rem,8.5vw,5.2rem);line-height:.94;letter-spacing:.01em;
    transform:skewX(-4deg);margin:8px 0 10px;text-shadow:5px 5px 0 rgba(255,212,0,.18);
  }
  body.dark-mode h1 .t1 { color: #111; -webkit-text-stroke: 1.5px var(--y); }
  h1 .t1{color:var(--w)}
  h1 .t2{color:var(--y)}
  .sub{font-size:.74rem;letter-spacing:.22em;color:rgba(255,255,255,.72);font-weight:700;text-transform:uppercase}
  .sub b{color:var(--y)}

  .stats{display:flex;flex-direction:column;gap:10px}
  .chip{
    background:var(--y);color:#111;font-family:var(--display);letter-spacing:.08em;
    padding:6px 16px;transform:skewX(-10deg);box-shadow:3px 3px 0 var(--w);
    font-size:.85rem;white-space:nowrap;transition:transform .18s ease, box-shadow .18s ease;
  }
  .chip:hover{transform:skewX(-10deg) translate(-2px,-2px);box-shadow:5px 5px 0 var(--w)}
  .chip.alt{background:var(--w);box-shadow:3px 3px 0 var(--y)}
  .chip.alt:hover{box-shadow:5px 5px 0 var(--y)}

  /* ---- ticker berjalan ---- */
  .ticker{background:var(--y);border-top:3px solid var(--k);border-bottom:3px solid var(--k);overflow:hidden}
  .ticker-track{display:flex;width:max-content;animation:tick 34s linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  .ticker-track span{
    font-family:var(--display);color:#111;font-size:.92rem;letter-spacing:.06em;
    padding:8px 0;white-space:nowrap;text-transform:uppercase;
  }
  @keyframes tick{to{transform:translateX(-50%)}}

  /* ---- bar legenda + navigasi cepat (sticky) ---- */
  .bar{
    position:sticky;top:0;z-index:40;background:var(--w);border-bottom:3px solid var(--k);
    display:flex;align-items:center;gap:18px;padding:9px 22px;flex-wrap:wrap;
    max-width:100%;
  }
  .bar-label{font-family:var(--display);font-size:.68rem;letter-spacing:.2em;flex:none}
  .legend{display:flex;gap:8px;flex:none}
  .status{
    font-family:var(--display);font-size:.62rem;letter-spacing:.12em;padding:3px 10px;
    transform:skewX(-8deg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .st-selesai{background:var(--k);color:var(--w)}
  body.dark-mode .st-selesai { background: #333; color: #fff; }
  .st-live{background:var(--y);color:#111}
  .st-live i{width:7px;height:7px;border-radius:50%;background:#111;animation:pulse 1.1s ease-out infinite}
  .st-belum{border:2px solid var(--k);color:var(--k);background:var(--w)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,17,17,.45)}100%{box-shadow:0 0 0 7px rgba(17,17,17,0)}}
  
  .tools-btn { display: flex; gap: 8px; margin-left: auto; flex: none; }
  .btn-action {
    font-family:var(--display);font-size:.64rem;letter-spacing:.1em;
    color:var(--k);text-decoration:none;padding:5px 12px;border:2px solid var(--k);
    background:var(--w);cursor:pointer;transition:background .15s, color .15s;
    text-transform: uppercase;
  }
  .btn-action:hover{background:var(--k);color:var(--w)}
  .btn-y{background:var(--y);border-color:var(--k);color:#111}
  .btn-y:hover{background:var(--k);color:var(--y)}

  .jump{display:flex;gap:4px;flex:none; border-left: 2px solid var(--k30); padding-left: 12px;}
  .jump a{
    font-family:var(--display);font-size:.64rem;letter-spacing:.1em;color:var(--k);
    text-decoration:none;padding:4px 9px;border:2px solid transparent;transition:background .15s,border-color .15s;
  }
  .jump a:hover{background:var(--y);border-color:var(--k);color:#111}

  main{max-width:1240px;margin:0 auto}
  section{scroll-margin-top:70px}

  /* ================= KEPALA RONDE ================= */
  .round-head{background:var(--k);color:var(--w);position:relative}
  body.dark-mode .round-head { background: #222; }
  .rhead-in{
    max-width:1200px;margin:0 auto;padding:20px 22px 22px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .rnum{
    font-family:var(--display);font-size:3.4rem;line-height:1;color:transparent;
    -webkit-text-stroke:2px var(--y);
  }
  @supports not (-webkit-text-stroke:1px black){.rnum{color:var(--y)}}
  .rtitle{
    font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4.5vw,2.4rem);
    letter-spacing:.08em;background:var(--y);color:#111;padding:3px 24px 1px;
    transform:skewX(-10deg);box-shadow:5px 5px 0 var(--w);
  }
  .rmeta{margin-left:auto;text-align:right;font-size:.66rem;letter-spacing:.18em;font-weight:700}
  .prog{width:160px;height:9px;border:2px solid var(--y);margin:7px 0 5px auto}
  .prog i{display:block;height:100%;background:var(--y);width:0;transition:width 1.1s ease .2s}
  .rcount{color:var(--y)}

  .round.final .round-head{background:var(--y);color:#111}
  .round.final .rnum{-webkit-text-stroke:2px #111}
  @supports not (-webkit-text-stroke:1px black){.round.final .rnum{color:#111}}
  .round.final .rtitle{background:#111;color:var(--y);box-shadow:5px 5px 0 rgba(17,17,17,.25)}
  .round.final .prog{border-color:#111}
  .round.final .prog i{background:#111}
  .round.final .rcount{color:#111}

  /* ================= KARTU PERTANDINGAN ================= */
  .matches{
    display:grid;gap:20px;padding:24px 22px 38px;
    grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
    max-width:1200px;margin:0 auto;
  }
  .round.semi .matches{max-width:820px}
  .round.final .matches{max-width:430px;grid-template-columns:1fr}

  .match{
    background:var(--w);border:3px solid var(--k);box-shadow:7px 7px 0 var(--k);
    display:flex;flex-direction:column;position:relative;
    transition:transform .18s ease, box-shadow .18s ease, opacity .3s ease;
  }
  .match.dim { opacity: 0.25; filter: grayscale(80%); }
  .match.highlight { border-color: var(--y); box-shadow: 7px 7px 0 var(--y); transform:translate(-3px,-3px); z-index: 10; }
  .match:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--y)}
  .round.final .match{border-width:4px;box-shadow:9px 9px 0 var(--y)}
  .round.final .match:hover{box-shadow:12px 12px 0 var(--k)}
  body.dark-mode .match { background: #222; }
  body.dark-mode .match.highlight { border-color: var(--y); }

  .match-top{
    background:var(--k);color:var(--w);display:flex;justify-content:space-between;
    align-items:center;gap:8px;padding:5px 10px;
  }
  body.dark-mode .match-top { background: #111; color: #fff; }
  .mnum{font-family:var(--display);color:var(--y);font-size:.8rem;letter-spacing:.12em;flex:none}
  .mdate{font-size:.62rem;letter-spacing:.05em;opacity:.85;text-align:right;font-weight:700}

  .match-body{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:16px 12px;flex:1;
  }
  .team{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0;transition:opacity .2s ease; cursor:pointer;}
  .team.lose{opacity:.5}
  .tname{font-size:.75rem;font-weight:700;line-height:1.2;word-break:break-word}
  .team.win .tname{background:var(--y);box-shadow:0 0 0 3px var(--y);font-weight:800; color:#111}
  .team.tbd .tname{font-style:italic;font-weight:600;color:var(--k60);font-size:.7rem}

  .badge{width:46px;height:46px;display:block;flex:none;transition:transform .2s ease}
  .match:hover .badge{transform:rotate(-4deg) scale(1.06)}
  .badge img,.badge svg{width:100%;height:100%;display:block;border-radius:50%;border:2.5px solid var(--k);background:var(--w);object-fit:cover}
  .team.win .badge img,.team.win .badge svg{box-shadow:0 0 0 3px var(--y)}
  .badge.xl{width:92px;height:92px}

  .mid{font-family:var(--display)}
  .score{
    background:var(--k);color:var(--y);font-size:1.55rem;letter-spacing:.05em;
    padding:5px 12px;min-width:70px;text-align:center;border:3px solid var(--k);
  }
  .score .dash{opacity:.55;padding:0 2px;font-size:1.1rem}
  .score.live{background:var(--y);color:#111;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{box-shadow:0 0 0 4px rgba(255,212,0,.55)}}
  .vs{font-size:1.1rem;color:var(--k);border:3px solid var(--k);padding:5px 14px;background:var(--w);letter-spacing:.1em}

  .match-bottom{
    border-top:2px dashed var(--k30);display:flex;justify-content:space-between;
    align-items:center;gap:8px;padding:7px 10px;
  }
  .feed{font-size:.58rem;font-weight:700;letter-spacing:.08em;color:var(--k60);text-transform:uppercase}

  /* ================= ZONA JUARA & TOP SKOR ================= */
  .juara-skor-wrap {
    display: grid; grid-template-columns: 1fr; gap: 20px;
    background:var(--k);color:var(--w);margin-top:14px;position:relative;overflow:hidden;
  }
  .juara-skor-wrap::before{
    content:'';position:absolute;inset:-60% -20%;pointer-events:none;
    background:repeating-linear-gradient(-45deg, rgba(255,212,0,.06) 0 46px, rgba(255,212,0,0) 46px 92px);
  }
  body.dark-mode .juara-skor-wrap { background: #1a1a1a; }
  @media(min-width: 900px){
    .juara-skor-wrap { grid-template-columns: 2fr 1fr; align-items: start; }
  }
  
  .juara-in, .top-skor-in { padding:44px 22px 50px; text-align:center; position:relative; z-index:2; }
  .juara h2, .top-skor-in h2 {
    font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5vw,2.8rem);
    color:var(--y);letter-spacing:.14em;transform:skewX(-4deg); margin-bottom: 20px;
  }
  .juara .hazard{max-width:220px;margin:14px auto 26px}
  .juara-slot{
    display:inline-flex;flex-direction:column;align-items:center;gap:12px;
    border:3px dashed rgba(255,255,255,.4);padding:26px 44px;
  }
  .trophy{width:76px;height:76px;animation:floaty 3.4s ease-in-out infinite}
  @keyframes floaty{50%{transform:translateY(-7px)}}
  .champ-name{font-family:var(--display);font-size:1.7rem;letter-spacing:.06em;color:var(--y)}
  .champ-sub{font-size:.64rem;letter-spacing:.3em;font-weight:700;color:rgba(255,255,255,.75)}

  .skor-table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
  .skor-table th, .skor-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem;}
  .skor-table th { font-family: var(--display); color: var(--y); letter-spacing: 0.1em; }
  .skor-table td.goals { text-align: center; font-weight: bold; color: var(--y); font-size: 1.1rem; font-family: var(--display); }

  footer{border-top:9px solid var(--y);background:var(--k);color:rgba(255,255,255,.75);text-align:center;padding:22px;font-size:.68rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
  footer b{color:var(--y)}
  body.dark-mode footer { background: #111; }

  /* ================= REVEAL SAAT SCROLL ================= */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease;transition-delay:var(--d,0ms)}
  .reveal.in{opacity:1;transform:none}

  /* ================= RESPONSIF ================= */
  @media (max-width:900px){
    .mast-inner{grid-template-columns:auto 1fr;gap:18px}
    .stats{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap}
    .crest{width:90px;height:90px}
  }
  @media (max-width:600px){
    .rnum{font-size:2.4rem}
    .rmeta{margin-left:0;text-align:left;width:100%}
    .prog{margin-left:0}
    .rhead-in{gap:14px}
    .bar{gap:12px; flex-wrap: wrap;}
    .tools-btn{margin-left: 0;}
    .jump{margin-left:0; border-left: none; padding-left: 0; width: 100%; justify-content: space-between; overflow-x: auto; padding-bottom: 5px;}
    .match-body{gap:7px}
    .badge{width:40px;height:40px}
    .score{min-width:58px;font-size:1.3rem}
    .tname{font-size:.7rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

  <!-- ================= HEADER TURNAMEN ================= -->
  <div class="hazard anim" aria-hidden="true"></div>
  <header class="masthead" id="capture-area">
    <div class="mast-inner">
      <span class="crest">
        <img src="images/logos/persaba-cup-logo.png" alt="Logo Persaba Cup 7"
             onerror="this.classList.add('dead');this.nextElementSibling.classList.remove('hidden')">
        <svg class="hidden" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <circle cx="48" cy="48" r="44" fill="#FFD400" stroke="#111" stroke-width="5"/>
          <circle cx="48" cy="48" r="33" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="4 5"/>
          <path d="M48 16l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5-4.8-4.6 6.6-.9z" fill="#111"/>
          <text x="48" y="66" text-anchor="middle" font-size="28" font-family="Impact,'Arial Narrow',sans-serif" fill="#111">P7</text>
        </svg>
      </span>
      <div>
        <div class="eyebrow">Open Turnamen Sepakbola</div>
        <h1><span class="t1">PERSABA</span> <span class="t2">CUP&nbsp;7</span></h1>
        <div class="sub">Askab PSSI Brebes <b>★</b> Kabupaten Brebes, Jawa Tengah <b>★</b> Juli – Agustus 2026</div>
      </div>
      <div class="stats" id="stats"><!-- diisi dari data --></div>
    </div>
    <div class="ticker" aria-hidden="true">
      <div class="ticker-track"><span id="tick1"></span><span id="tick2"></span></div>
    </div>
  </header>

  <!-- ================= LEGENDA + NAVIGASI ================= -->
  <nav class="bar" aria-label="Legenda status dan navigasi babak">
    <span class="bar-label">STATUS</span>
    <div class="legend">
      <span class="status st-selesai">SELESAI</span>
      <span class="status st-live"><i></i>LIVE</span>
      <span class="status st-belum">BELUM MAIN</span>
    </div>
    <div class="tools-btn">
      <button class="btn-action" onclick="toggleDarkMode()">Dark Mode</button>
      <button class="btn-action btn-y" onclick="downloadImage()">Unduh Bagan</button>
    </div>
    <div class="jump">
      <a href="#round-0">32 BESAR</a><a href="#round-1">16 BESAR</a><a href="#round-2">8 BESAR</a>
      <a href="#round-3">SEMI FINAL</a><a href="#round-4">FINAL</a>
    </div>
  </nav>

  <main id="bracket-main">
    <div id="bracket"><!-- seluruh bagan digambar dari data.json --></div>

    <!-- ================= ZONA JUARA & TOP SKOR ================= -->
    <section class="juara-skor-wrap reveal">
      <div class="juara-in juara">
        <h2>TAHTA JUARA</h2>
        <div class="hazard" aria-hidden="true"></div>
        <div class="juara-slot" id="juara-slot"><!-- diisi dari data --></div>
      </div>
      <div class="top-skor-in">
        <h2>TOP SKOR</h2>
        <table class="skor-table">
          <thead>
            <tr>
              <th>NAMA</th>
              <th>TIM</th>
              <th>GOL</th>
            </tr>
          </thead>
          <tbody id="top-skor-body">
            <!-- diisi dari data -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <b>PERSABA CUP 7</b> ★ Sistem Gugur ★ 32 Tim — Brebes, Jawa Tengah
  </footer>

  <div id="loading-overlay" style="position:fixed;inset:0;background:rgba(255,255,255,0.8);z-index:9999;display:none;justify-content:center;align-items:center;font-family:var(--display);font-size:2rem;color:var(--k);">
    MEMPROSES GAMBAR...
  </div>

  <noscript><p style="padding:20px;text-align:center">Aktifkan JavaScript untuk melihat bagan turnamen.</p></noscript>

<script>
/* =====================================================================
   APP LOGIC: Fetch Data & Render
   ===================================================================== */
let D = null;
let activeHighlightTeam = null;

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + new Date().getTime());
    D = await res.json();
    render();
  } catch(e) {
    console.error("Gagal memuat data.json", e);
    if(!D) document.getElementById('bracket').innerHTML = '<p style="text-align:center;padding:50px;">Gagal memuat data pertandingan.</p>';
  }
}

// Auto-refresh tiap 60 detik
setInterval(loadData, 60000);

/* ---------- FITUR: HIGHLIGHT JALUR TIM ---------- */
function highlightTeam(slug) {
  if (activeHighlightTeam === slug) {
    // toggle off
    activeHighlightTeam = null;
    document.querySelectorAll('.match').forEach(el => {
      el.classList.remove('highlight');
      el.classList.remove('dim');
    });
    return;
  }
  activeHighlightTeam = slug;
  document.querySelectorAll('.match').forEach(el => {
    // cek apakah match ini melibatkan tim yang di-klik
    const hasTeam = el.dataset.teams && el.dataset.teams.includes(slug);
    if (hasTeam) {
      el.classList.add('highlight');
      el.classList.remove('dim');
    } else {
      el.classList.remove('highlight');
      el.classList.add('dim');
    }
  });
}

/* ---------- FITUR: DARK MODE ---------- */
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
}

/* ---------- FITUR: DOWNLOAD GAMBAR ---------- */
function downloadImage() {
  const btn = document.querySelector('.btn-y');
  btn.textContent = 'TUNGGU...';
  const overlay = document.getElementById('loading-overlay');
  overlay.style.display = 'flex';
  
  // reset highlight sebelum capture
  if(activeHighlightTeam) highlightTeam(activeHighlightTeam);

  html2canvas(document.body, {
    scale: 2,
    useCORS: true,
    backgroundColor: document.body.classList.contains('dark-mode') ? '#181818' : '#ffffff'
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'bagan-persaba-cup.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    btn.textContent = 'UNDUH BAGAN';
    overlay.style.display = 'none';
  }).catch(err => {
    alert("Gagal mengunduh gambar.");
    btn.textContent = 'UNDUH BAGAN';
    overlay.style.display = 'none';
  });
}

/* =====================================================================
   MESIN RENDER
   ===================================================================== */
function render() {
  if(!D) return;
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function statusOf(r, m) {
    if (D.LIVE_MATCH && D.LIVE_MATCH.round === r && D.LIVE_MATCH.match === m) return "live";
    const md = D.rounds[r].matches[m];
    return (md.a != null && md.b != null) ? "selesai" : "belum";
  }
  const STATUS_TEXT = { selesai: "SELESAI", live: "SEDANG BERLANGSUNG", belum: "BELUM MAIN" };

  function slotTeam(r, m, side) {
    if (r === 0) return { team: D.TEAMS[m * 2 + side] };
    const f = m * 2 + side;                                   
    if (statusOf(r - 1, f) === "selesai") {
      const pm = D.rounds[r - 1].matches[f];
      return slotTeam(r - 1, f, pm.a > pm.b ? 0 : 1);
    }
    return { label: "Pemenang di babak sebelumnya" };
  }

  function initialsOf(name) {
    const w = name.trim().split(/\s+/);
    return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
  }
  function badgeHTML(team, extra) {
    extra = extra || "";
    const ini = initialsOf(team.name);
    return '<span class="badge ' + extra + '">' +
      '<img src="images/logos/' + team.slug + '.png" alt="Logo ' + esc(team.name) + '" loading="lazy" ' +
      'onerror="this.classList.add('dead');this.nextElementSibling.classList.remove('hidden')">' +
      '<svg class="hidden" viewBox="0 0 48 48" aria-hidden="true" focusable="false">' +
      '<circle cx="24" cy="24" r="21.5" fill="#FFD400" stroke="#111" stroke-width="2.5"/>' +
      '<text x="24" y="31" text-anchor="middle" font-size="17" font-family="Impact,'Arial Narrow',sans-serif" fill="#111">' + ini + '</text>' +
      '</svg></span>';
  }
  const TBD_BADGE =
    '<span class="badge"><svg viewBox="0 0 48 48" aria-hidden="true">' +
    '<circle cx="24" cy="24" r="21" fill="#fff" stroke="#111" stroke-width="2.5" stroke-dasharray="5 4"/>' +
    '<text x="24" y="31" text-anchor="middle" font-size="18" font-family="Impact,sans-serif" fill="#111">?</text>' +
    '</svg></span>';

  function teamHTML(slot, isWin, isLose) {
    const cls = "team" + (isWin ? " win" : "") + (isLose ? " lose" : "") + (slot.team ? "" : " tbd");
    const badge = slot.team ? badgeHTML(slot.team) : TBD_BADGE;
    const name = slot.team ? esc(slot.team.name) : esc(slot.label);
    const slug = slot.team ? slot.team.slug : "";
    return '<div class="' + cls + '" ' + (slug ? 'onclick="highlightTeam(''+slug+'')"' : '') + ' title="Klik untuk sorot tim ini">' + badge + '<div class="tname">' + name + '</div></div>';
  }

  function matchCard(r, m) {
    const R = D.rounds[r], md = R.matches[m];
    const st = statusOf(r, m);
    const A = slotTeam(r, m, 0), B = slotTeam(r, m, 1);
    const aWin = st === "selesai" && md.a > md.b;
    const bWin = st === "selesai" && md.b > md.a;
    const hasScore = md.a != null && md.b != null;

    const mid = hasScore
      ? '<div class="mid score' + (st === "live" ? " live" : "") + '">' + md.a + '<span class="dash">–</span>' + md.b + '</div>'
      : '<div class="mid vs">VS</div>';

    const feed = r < 4
      ? '→ ' + D.rounds[r + 1].tag + '-' + pad(Math.floor(m / 2) + 1)
      : 'PARTAI PUNCAK — MENENTUKAN JUARA';
      
    const slugA = A.team ? A.team.slug : '';
    const slugB = B.team ? B.team.slug : '';
    const ds = (slugA + " " + slugB).trim();

    return '<article class="match reveal" data-teams="'+ds+'" style="--d:' + ((m % 6) * 55) + 'ms">' +
      '<div class="match-top"><span class="mnum">' + R.tag + '-' + pad(m + 1) + '</span>' +
      '<span class="mdate">' + esc(md.date) + '</span></div>' +
      '<div class="match-body">' + teamHTML(A, aWin, bWin) + mid + teamHTML(B, bWin, aWin) + '</div>' +
      '<div class="match-bottom">' +
      '<span class="status st-' + st + '">' + (st === "live" ? '<i></i>' : '') + STATUS_TEXT[st] + '</span>' +
      '<span class="feed">' + feed + '</span>' +
      '</div></article>';
  }

  let html = "";
  D.rounds.forEach((R, r) => {
    const total = R.matches.length;
    const done = R.matches.filter((_, m) => statusOf(r, m) === "selesai").length;
    const special = r === 4 ? " final" : (r === 3 ? " semi" : "");
    html += '<section class="round' + special + '" id="round-' + r + '">' +
      '<div class="round-head"><div class="rhead-in">' +
      '<div class="rnum">' + pad(r + 1) + '</div>' +
      '<h2 class="rtitle">' + R.name + '</h2>' +
      '<div class="rmeta"><div>' + total + ' PERTANDINGAN</div>' +
      '<div class="prog"><i data-w="' + Math.round(done / total * 100) + '%"></i></div>' +
      '<div class="rcount">' + done + '/' + total + ' SELESAI</div></div>' +
      '</div></div><div class="hazard" aria-hidden="true"></div>' +
      '<div class="matches">' + R.matches.map((_, m) => matchCard(r, m)).join("") + '</div>' +
      '</section>';
  });
  
  const bracketEl = $("#bracket");
  // Simpan HTML baru
  bracketEl.innerHTML = html;
  
  // Apply ulang highlight jika ada
  if(activeHighlightTeam) {
      const active = activeHighlightTeam;
      activeHighlightTeam = null; 
      highlightTeam(active);
  }

  const totalMatches = D.rounds.reduce((s, R) => s + R.matches.length, 0);
  $("#stats").innerHTML =
    '<span class="chip">' + D.TEAMS.length + ' TIM</span>' +
    '<span class="chip alt">' + totalMatches + ' LAGA</span>' +
    '<span class="chip">' + D.rounds.length + ' BABAK</span>' +
    '<span class="chip alt">1 JUARA</span>';

  const items = [];
  if (D.LIVE_MATCH) {
    const r = D.LIVE_MATCH.round, m = D.LIVE_MATCH.match, md = D.rounds[r].matches[m];
    const A = slotTeam(r, m, 0), B = slotTeam(r, m, 1);
    items.push("● LIVE: " + (A.team ? A.team.name : A.label) + " " + (md.a != null ? md.a : 0) + "–" + (md.b != null ? md.b : 0) + " " + (B.team ? B.team.name : B.label));
  }
  for (let r = 0; r < D.rounds.length; r++) {
    D.rounds[r].matches.forEach((md, m) => {
      if (statusOf(r, m) === "selesai") {
        const A = slotTeam(r, m, 0), B = slotTeam(r, m, 1);
        items.push(D.rounds[r].tag + ": " + A.team.name + " " + md.a + "–" + md.b + " " + B.team.name);
      }
    });
  }
  nextUp:
  for (let r = 0; r < D.rounds.length; r++) {
    for (let m = 0; m < D.rounds[r].matches.length; m++) {
      if (statusOf(r, m) === "belum") {
        const A = slotTeam(r, m, 0), B = slotTeam(r, m, 1);
        items.push("BERIKUTNYA (" + D.rounds[r].tag + "): " + (A.team ? A.team.name : A.label) + " vs " + (B.team ? B.team.name : B.label) + " • " + D.rounds[r].matches[m].date);
        break nextUp;
      }
    }
  }
  const tickText = ("PERSABA CUP 7 ★ " + items.slice(-10).reverse().join("  ★  ") + "  ★  ").repeat(4);
  $("#tick1").textContent = tickText;
  $("#tick2").textContent = tickText;

  const fin = D.rounds[4].matches[0];
  const slot = $("#juara-slot");
  if (statusOf(4, 0) === "selesai") {
    const c = slotTeam(4, 0, fin.a > fin.b ? 0 : 1).team;
    slot.innerHTML = badgeHTML(c, "xl") +
      '<div class="champ-name">' + esc(c.name) + '</div><div class="champ-sub">JUARA PERSABA CUP 7</div>';
  } else {
    slot.innerHTML =
      '<svg class="trophy" viewBox="0 0 64 64" aria-hidden="true">' +
      '<path d="M20 8h24v12c0 9-6 15-12 15S20 29 20 20z" fill="#FFD400" stroke="#111" stroke-width="3"/>' +
      '<path d="M20 12h-8c0 9 5 13 10 13M44 12h8c0 9-5 13-10 13" fill="none" stroke="#111" stroke-width="3"/>' +
      '<rect x="29" y="35" width="6" height="8" fill="#FFD400" stroke="#111" stroke-width="2.5"/>' +
      '<rect x="23" y="43" width="18" height="6" fill="#FFD400" stroke="#111" stroke-width="2.5"/>' +
      '<rect x="19" y="49" width="26" height="6" fill="#FFD400" stroke="#111" stroke-width="2.5"/>' +
      '<path d="M32 14l2 4.2 4.6.6-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" fill="#111"/></svg>' +
      '<div class="champ-name">? ? ?</div><div class="champ-sub">MENUNGGU HASIL PARTAI FINAL</div>';
  }
  
  /* Render Top Skor */
  if (D.top_scorers) {
      const topSkorHtml = D.top_scorers.map(t => 
        `<tr><td>${esc(t.name)}</td><td>${esc(t.team)}</td><td class="goals">${t.goals}</td></tr>`
      ).join('');
      $("#top-skor-body").innerHTML = topSkorHtml;
  }

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      e.target.querySelectorAll(".prog i").forEach(i => { i.style.width = i.dataset.w; });
      io.unobserve(e.target);
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
}

// Inisialisasi awal
loadData();
</script>
</body>
</html>
